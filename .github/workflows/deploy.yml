# PURPOSE: CI/CD pipeline that deploys HireLog to AWS on every push to main.
#
# HOW IT WORKS:
#   1. Triggered on push to `main` branch
#   2. Installs Python deps and AWS SAM CLI
#   3. Runs `sam build` — packages each Lambda with its dependencies
#   4. Runs `sam deploy` — uploads to S3, updates CloudFormation stack
#
# SECRETS NEEDED (set these in GitHub → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — IAM user access key (deploy-only, least-privilege)
#   AWS_SECRET_ACCESS_KEY  — IAM user secret key
#   JWT_SECRET             — passed into Lambda as environment variable
#   ALLOWED_ORIGIN         — your frontend domain (or * for dev)

name: Deploy HireLog to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SAM Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ======= 1. Checkout code =========================================─
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======= 2. Set up Python (must match your Lambda runtime) =======================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======= 3. Install AWS SAM CLI ===========================
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ======= 4. Configure AWS credentials from GitHub Secrets =========
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      # ======= 5. SAM Build — resolves deps for each Lambda function =========
      - name: SAM Build
        run: sam build --use-container

      # ======= 6. SAM Deploy — pushes build artifacts and updates the stack 
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name hirelog \
            --region us-east-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              AllowedOrigin="${{ secrets.ALLOWED_ORIGIN }}"